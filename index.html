<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bodensee 2035 – Testseite</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #082446;
        background: #f6fbfc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(680px, 100%);
        padding: 56px 40px;
        text-align: center;
        background: white;
        border: 1px solid #d7ebef;
        border-radius: 20px;
        box-shadow: 0 16px 48px rgba(8, 36, 70, 0.08);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #119ac6;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 70px);
        line-height: 1;
        font-weight: 700;
      }

      p:last-child {
        margin: 24px 0 0;
        color: #496579;
        font-size: 18px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Verbindungstest erfolgreich</p>
      <h1>Bodensee 2035</h1>
      <p>Diese einfache HTML-Testseite wurde erfolgreich aus dem GitHub-Repository veröffentlicht.</p>
    </main>
  </body>
</html>
